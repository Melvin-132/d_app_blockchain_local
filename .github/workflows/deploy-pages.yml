name: Deploy Clayde Chain to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate Sepolia token configuration
        run: |
          node -e 'const deployment = require("./contracts/sepolia-deployment.json"); if (!/^0x[a-fA-F0-9]{40}$/.test(deployment.address) || !Number.isSafeInteger(deployment.blockNumber) || deployment.blockNumber <= 0) { console.error("Set the CYD contract address and deployment block in contracts/sepolia-deployment.json."); process.exit(1); }'
      - name: Install dependencies
        run: npm ci
      - name: Build all interfaces
        env:
          VITE_SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
        run: |
          mkdir -p _site/blockchain _site/explorer _site/dapp
          VITE_BASE_PATH="/${GITHUB_REPOSITORY#*/}/blockchain/" npm run build:blockchain
          cp -R apps/blockchain/dist/. _site/blockchain/
          VITE_BASE_PATH="/${GITHUB_REPOSITORY#*/}/explorer/" npm run build:explorer
          cp -R apps/explorer/dist/. _site/explorer/
          VITE_BASE_PATH="/${GITHUB_REPOSITORY#*/}/dapp/" npm run build:dapp
          cp -R apps/dapp/dist/. _site/dapp/
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
